services:

  web:
    env_file:
      - .env
    build: 
      context: .
    networks:
      - app-network
    ports:
      - "8000:8000"
    command: gunicorn main.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    environment:
      DATABASE_URL: ${DATABESE_URL_DOCKER}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
       condition: service_healthy

  db:
    restart: unless-stopped
    image: postgres:17
    environment:
      POSTGRES_DB: Taskly
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    networks:
      - app-network
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d Taskly"]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    restart: always
    command: redis-server --appendonly yes
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery:
    build: .
    env_file:
      - .env
    command: celery -A main worker --loglevel=info --concurrency=2
    networks:
      - app-network
    environment:
        DATABASE_URL: ${DATABESE_URL_DOCKER}
        CELERY_BROKER_URL: redis://redis:6379/0
        CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
      - web
      - db

  celerybeat:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - celery
    command: celery -A main beat -l DEBUG
    environment:
        DATABASE_URL: ${DATABESE_URL_DOCKER}
        CELERY_BROKER_URL: redis://redis:6379/0
        CELERY_RESULT_BACKEND: redis://redis:6379/0
    networks:
     - app-network

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    depends_on:
      - web
    networks:
      - app-network

networks:
  app-network:
    driver: bridge


volumes:
  pg_data:
  static_volume:
  media_volume: