name: Create pull request

on:
  workflow_run:
    workflows: [Run pytests]
    types:
      - completed

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull_requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Create pull request
        run: |
          gh pr create \
            --base main \
            --head feature-branch \
            --title "Propose changes" \
            --body "${{ github.event.push.commits.message }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}