name: Run pytests
on: 
  push:
    branches:
      - main
  workflow_dispatch:
jobs: 
  Test_project:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: task_user
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: Taskly
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379


    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'
        
      - run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: Django
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ENABLE_CELERY: ${{ secrets.ENABLE_CELERY }}
        run: pytest